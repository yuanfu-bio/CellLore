[build-system]
# setuptools>=77 is required for PEP 639 SPDX license metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "celllore"
version = "0.1.0"
description = "CellLore: evidence-first discovery and curation for public single-cell epigenomics data."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yuan Fu", email = "yuanfu_bio@163.com" }]
keywords = [
  "single-cell",
  "scATAC-seq",
  "multiome",
  "epigenomics",
  "data-curation",
  "foundation-model",
  "langgraph",
  "agent",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langchain>=1,<2",
  "langchain-anthropic>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.12,<3",
  "rich>=14,<15",
  "typer>=0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "langgraph-cli[inmem]>=0.4,<1",
  "ruff>=0.9,<1",
  "pyyaml>=6,<7",
]

curation = [
  "anndata>=0.11,<1",
  "h5py>=3.12,<4",
  "mudata>=0.3,<1",
]

[project.scripts]
celllore = "celllore.interfaces.cli:app"

[project.urls]
Homepage = "https://github.com/yuanfu-bio/CellLore"
Repository = "https://github.com/yuanfu-bio/CellLore"
Issues = "https://github.com/yuanfu-bio/CellLore/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The distribution declares "Typing :: Typed"; without this the marker is not
# shipped and the claim is unenforceable for anyone installing the wheel.
celllore = ["py.typed"]
"celllore.interfaces" = [
  "templates/*.html",
  "static/ui/index.html",
  "static/ui/assets/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Deliberately narrow. Two people merging into one branch all week need a linter
# that catches real defects (unused imports, shadowed builtins, mutable defaults)
# without generating a reformatting diff that hides the substantive change.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4"]
ignore = [
  "B008",  # Typer and FastAPI both declare defaults by calling a function.
]

[tool.ruff.lint.per-file-ignores]
# The layering test imports modules for their side effects on sys.modules.
"tests/test_architecture.py" = ["F401"]
