      A database and search tool for scATAC-seq data. Points at other people's
      depositions; owns none.
  src_f5b21454c664af18:
    kind: resource_paper
    expect_profile: true
    note: >-
      "Assessment and applications of joint profiling..." -- an assessment of
      the technology, not a deposition using it.

# ---------------------------------------------------------------------------
# Questions. Each is compiled by the offline rule-based compiler and scored
# against the replay corpus, so the whole harness runs without network or key.
# ---------------------------------------------------------------------------
questions:
  - id: scatac_pretraining
    question: >-
      public scATAC-seq and snATAC-seq data for self-supervised representation
      learning
    expect_eligible_kinds: [primary_deposition]
    note: The broad corpus-building case. Standalone accessibility must qualify.

  - id: same_cell_multiome
    question: >-
      paired single-cell multiome data measuring chromatin accessibility and
      the transcriptome in the same cell, 10x Multiome or SNARE-seq, for
      self-supervised pretraining
    requires_pairing: same_cell
    expect_eligible_kinds: [primary_deposition]
    # Only records whose pairing claim reaches the same-cell tier belong here.
    expect_recalled: [src_b5b175ca0b94e758]
    # The ENCODE snATAC depositions brokered by GEO. Their ESummary blob is what
    # made them look like same-nucleus multiome; naming them here means the
    # question can never silently start admitting them again. Kept as an
    # assertion rather than left to `deposition_precision`, because excluding a
    # record that should never have passed *lowers* that number -- so the fix
    # and the defect read identically as a delta.
    forbid_modality_pass:
      - src_22124b1fe971220e
      - src_2df1d11ae03fd153
      - src_54a59c6c4bd45e64
      - src_57248e77a2228f65
      - src_6e868a575fad7a09
      - src_6ffd4533ce4fb5b2
      - src_7733f3dadbdac954
      - src_77a05241bab22efa
      - src_9ca7465010918413
      - src_a7dc7e03243e8ad6
      - src_d1f7a0c326197099
      - src_ede6bc8daeda20d8
      - src_f82967d4f449c48d
      - src_fbf45617507a9421
      - src_ff437d702fd6c08e
    note: >-
      The narrowing case. GSE340993 declares a 10x Multiome relationship; the
      plain snATAC records must not satisfy a same-cell requirement.

      `deposition_precision` here fell from 0.6667 to 0.6000 when P0.0 was
      fixed, and that fall is the fix working: the passing set lost primary
      depositions that were only passing because ENCODE's umbrella BioProject
      had merged them into a candidate that contained one real multiome record.
      Read `forbid_modality_pass` before reading the precision number -- the
      list is the guarantee, the rate is a summary.

  - id: non_atac_generality
    question: >-
      human single-cell RNA sequencing data for cell type annotation
    expect_eligible_kinds: [primary_deposition]
    note: >-
      Not an ATAC question at all. It is here to prove the pipeline is not
      hardwired to one modality -- it must still compile a requirement and
      produce a structured judgement rather than an empty result.

      `deposition_precision` fell from 0.5833 to 0.5000 with the P0.0 fix, for
      the same reason as `same_cell_multiome`: standalone snATAC depositions
      stopped passing an scRNA question they never had the data to answer.
      A rate cannot distinguish a lost right answer from a lost wrong one.
